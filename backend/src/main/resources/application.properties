# Server Configuration
server.port=${PORT:8080}

# Application
spring.application.name=employee-management-system
spring.main.allow-bean-definition-overriding=true
spring.sql.init.mode=never

# Default profile (can be switched with --spring.profiles.active=mysql or dev)
spring.profiles.active=dev

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# JWT Properties
app.jwt.secret=9a6e8b2c4d6f8a0e2c4b6d8e0a2c4b6d8e0a2c4b6d8e0a2c4b6d8e0a2c4b6d8e
app.jwt.expiration-milliseconds=86400000

# Leave Business Logic Configuration
app.leave.exclude-weekends=true

